---
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Download antigravity repo signing key
  ansible.builtin.get_url:
    url: https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg
    dest: /tmp/antigravity-repo-key.asc
    mode: "0644"

- name: Dearmor antigravity repo signing key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg /tmp/antigravity-repo-key.asc
    creates: /etc/apt/keyrings/antigravity-repo-key.gpg
  become: true

- name: Add antigravity apt repository
  ansible.builtin.deb822_repository:
    name: antigravity
    types: [deb]
    uris: https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/
    signed_by: /etc/apt/keyrings/antigravity-repo-key.gpg
    suites: [antigravity-debian]
    components: [main]
    state: present
    enabled: true
  become: true

- name: Install antigravity
  ansible.builtin.apt:
    name: antigravity
    state: latest
    update_cache: true
  become: true
