---
# https://launchpad.net/~mkasberg/+archive/ubuntu/ghostty-ubuntu
- name: Add Ghostty apt repository
  ansible.builtin.deb822_repository:
    name: ghostty
    types: [deb]
    uris: https://ppa.launchpadcontent.net/mkasberg/ghostty-ubuntu/ubuntu
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0721FDF5FECB88DC6920361657C8EF455CEAE491
    suites: ["{{ ansible_distribution_release | lower }}"]
    components: [main]
    state: present
    enabled: true
  become: true

- name: Install Ghostty
  ansible.builtin.apt:
    name: ghostty
    state: latest
    update_cache: true
  become: true

- name: Register Ghostty as default terminal
  ansible.builtin.command: update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator /usr/bin/ghostty 50
  become: true
  changed_when: false
