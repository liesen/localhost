# Installs ROCm from AMD's stable apt repository per https://rocm.docs.amd.com/en/latest/install/rocm.html
# Kernel driver: in-tree amdgpu from the Pop!_OS kernel (inbox driver per Ryzen APU prerequisites)
---
- name: Add ROCm stable repository
  ansible.builtin.deb822_repository:
    name: amdrocm-stable
    types: [deb]
    uris: https://stable.repo.amd.com/rocm/core/packages/ubuntu2404/
    signed_by: https://stable.repo.amd.com/rocm/gpg/packages.gpg
    suites: [stable]
    components: [main]
    architectures: [amd64]
    state: present
    enabled: true
  become: true

- name: Install ROCm
  ansible.builtin.apt:
    pkg: amdrocm10.0-gfx1103
    state: latest
    update_cache: true
  become: true

- name: Add current user to GPU access groups
  ansible.builtin.user:
    name: "{{ lookup('ansible.builtin.env', 'USER') }}"
    groups: [render, video]
    append: true
  become: true

- name: Set ROCm environment variables
  ansible.builtin.blockinfile:
    path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: ROCm"
    prepend_newline: true
    block: |
      export PATH="$PATH:/opt/rocm/bin"
